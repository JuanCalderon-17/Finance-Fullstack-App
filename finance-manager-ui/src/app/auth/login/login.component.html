<section class="login-container">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-xl-10">
        
        <div class="card rounded-3 text-white auth-card">
          <div class="row g-0">
            
            <div class="col-lg-6">
              <div class="card-body p-md-5 mx-md-4">

                <div class="text-center">
                  <img src="finanzascapa.png" style="width: 160px; filter: brightness(0) invert(1);" alt="logo">
                </div>

                <form (ngSubmit)="login()">
                  <p class="mb-4 text-center text-muted">
                    {{ 'AUTH.LOGIN.TITLE' | translate }}
                  </p>

                  <div class="form-group mb-4">
                    <label class="form-label" for="username">
                      {{ 'AUTH.LOGIN.EMAIL' | translate }}
                    </label>
                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control custom-input"
                           [placeholder]="'AUTH.LOGIN.EMAIL_PLACEHOLDER' | translate"
                           [(ngModel)]="model.username"
                           required />
                  </div>

                  <div class="form-group mb-4">
                    <label class="form-label" for="password">
                      {{ 'AUTH.LOGIN.PASSWORD' | translate }}
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control custom-input"
                           [placeholder]="'AUTH.LOGIN.PASSWORD_PLACEHOLDER' | translate"
                           [(ngModel)]="model.password"
                           required />
                  </div>

                  <div *ngIf="errorMessage" class="alert alert-danger text-center">
                    {{ errorMessage }}
                  </div>

                  <div class="text-center pt-1 mb-5 pb-1">
                    <button class="btn btn-primary btn-block fa-lg gradient-custom-2 mb-3 btn-login" 
                            type="submit" 
                            [disabled]="isLoading">
                      
                      <ng-container *ngIf="isLoading">
                        <span class="spinner-border spinner-border-sm me-2"></span>
                        Loading...
                      </ng-container>

                      <span *ngIf="!isLoading">
                        {{ 'AUTH.LOGIN.BUTTON' | translate }}
                      </span>
                    </button>
                    
                    <a class="forgot-link" routerLink="/auth/forgot-password">
                      {{ 'AUTH.LOGIN.FORGOT_PASSWORD' | translate }}
                    </a>
                  </div>

                  <div class="d-flex align-items-center justify-content-center pb-4">
                    <p class="mb-0 me-2 text-muted">
                      {{ 'AUTH.LOGIN.NO_ACCOUNT' | translate }}
                    </p>
                    <button type="button" class="btn btn-outline-light btn-sm" routerLink="/auth/register">
                      {{ 'AUTH.LOGIN.REGISTER_LINK' | translate }}
                    </button>
                  </div>

                </form>

              </div>
            </div>

            <div class="col-lg-6 d-flex align-items-center gradient-side">
              <div class="text-white px-3 py-4 p-md-5 mx-md-4">
                <h4 class="mb-4 title-text">
                  {{ 'AUTH.LOGIN.HERO_TITLE' | translate }}
                </h4>
                <p class="small mb-0 text-muted-light">
                  {{ 'AUTH.LOGIN.HERO_TEXT' | translate }}
                </p>
              </div>
            </div>
          
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
