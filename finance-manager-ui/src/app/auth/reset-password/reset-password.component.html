<div class="auth-container">
  <div class="auth-card">
    
    <h2>RESTABLECER CONTRASEÑA</h2>
    <p class="instruction">
      Ingresa tu nueva contraseña para tu cuenta.
    </p>

    <form (ngSubmit)="onSubmit()" *ngIf="token && email">
      <div class="form-group">
        <label for="newPassword">Nueva Contraseña</label>
        <input 
          type="password" 
          id="newPassword" 
          name="newPassword" 
          [(ngModel)]="newPassword" 
          placeholder="Mínimo 6 caracteres" 
          required
          [disabled]="isLoading">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          placeholder="Repite la contraseña" 
          required
          [disabled]="isLoading">
      </div>

      <div *ngIf="message" style="color: green; margin-bottom: 1rem; font-weight: bold; text-align: center;">
        {{ message }}
      </div>

      <div *ngIf="errorMessage" style="color: red; margin-bottom: 1rem; font-weight: bold; text-align: center;">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="btn-submit" 
        [disabled]="isLoading || !newPassword || !confirmPassword">
        {{ isLoading ? 'RESTABLECIENDO...' : 'RESTABLECER CONTRASEÑA' }}
      </button>
    </form>

    <div class="back-link">
      <a routerLink="/auth/login">← Volver al Login</a>
    </div>

  </div>
</div>
