<div class="auth-container">
  <div class="auth-card">
    
    <div class="text-center mb-4">
      <h1 class="display-1">🔐</h1> 
      <h2>RESTABLECER CONTRASEÑA</h2>
      <p class="instruction">Ingresa tu nueva contraseña para tu cuenta.</p>
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="token && email">
      
      <div class="form-group">
        <label for="newPassword">Nueva Contraseña</label>
        <div class="password-wrapper">
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="Mínimo 6 caracteres"
            required
            [disabled]="isLoading">
          <button type="button"
                  class="password-toggle"
                  (click)="showNewPassword = !showNewPassword"
                  [attr.aria-label]="showNewPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                  [attr.aria-pressed]="showNewPassword">
            <i class="bi" [class.bi-eye]="!showNewPassword" [class.bi-eye-slash]="showNewPassword"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <div class="password-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Repite la contraseña"
            required
            [disabled]="isLoading">
          <button type="button"
                  class="password-toggle"
                  (click)="showConfirmPassword = !showConfirmPassword"
                  [attr.aria-label]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                  [attr.aria-pressed]="showConfirmPassword">
            <i class="bi" [class.bi-eye]="!showConfirmPassword" [class.bi-eye-slash]="showConfirmPassword"></i>
          </button>
        </div>
      </div>

      <div *ngIf="message" class="alert alert-success">
        {{ message }}
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="btn-submit" 
        [disabled]="isLoading || !newPassword || !confirmPassword">
        
        <span *ngIf="isLoading">
          <span class="spinner"></span> Restableciendo...
        </span>
        <span *ngIf="!isLoading">RESTABLECER CONTRASEÑA</span>
      </button>

    </form>

    <!-- Mensaje si el link es inválido -->
    <div *ngIf="!token || !email" class="alert alert-danger">
      <p>Link inválido o expirado.</p>
      <a routerLink="/auth/forgot-password" class="link-button">Solicitar nuevo enlace</a>
    </div>

    <div class="back-link">
      <a routerLink="/auth/login">← Volver al Login</a>
    </div>

  </div>
</div>
