<div class="auth-container">
  <div class="auth-card">
    
    <h2>{{ 'AUTH.FORGOT_PASSWORD.TITLE' | translate }}</h2>
    <p class="instruction">
      {{ 'AUTH.FORGOT_PASSWORD.INSTRUCTIONS' | translate }}
    </p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ 'AUTH.FORGOT_PASSWORD.EMAIL' | translate }}</label>
        
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          [placeholder]="'AUTH.FORGOT_PASSWORD.EMAIL_PLACEHOLDER' | translate"
          required
          [disabled]="isLoading">
      </div>

      <div *ngIf="message" class="auth-alert auth-alert--success" role="status">
        <span class="auth-alert__icon"><i class="bi bi-envelope-check-fill"></i></span>
        <div class="auth-alert__body">{{ message }}</div>
      </div>

      <div *ngIf="errorMessage" class="auth-alert auth-alert--error" role="alert">
        <span class="auth-alert__icon"><i class="bi bi-exclamation-triangle-fill"></i></span>
        <div class="auth-alert__body">{{ errorMessage }}</div>
      </div>

      <button 
        type="submit" 
        class="btn-submit" 
        [disabled]="isLoading || !email">
        {{ isLoading ? ('BUTTONS.SENDING' | translate) : ('AUTH.FORGOT_PASSWORD.BUTTON_SEND' | translate) }}
      </button>
    </form>

    <div class="back-link">
      <a routerLink="/auth/login">{{'AUTH.FORGOT_PASSWORD.BACK_TO_LOGIN' | translate }}</a>
    </div>

  </div>
</div>
