<div class="auth-container">
  <div class="auth-card">
    
    <h2>RECUPERAR CUENTA</h2>
    <p class="instruction">
      Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.
    </p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="ejemplo@correo.com" 
          required
          [disabled]="isLoading">
      </div>

      <div *ngIf="message" style="color: green; margin-bottom: 1rem; font-weight: bold; text-align: center;">
        {{ message }}
      </div>

      <div *ngIf="errorMessage" style="color: red; margin-bottom: 1rem; font-weight: bold; text-align: center;">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="btn-submit" 
        [disabled]="isLoading || !email">
        {{ isLoading ? 'ENVIANDO...' : 'ENVIAR ENLACE' }}
      </button>
    </form>

    <div class="back-link">
      <a routerLink="/auth/login">← Volver al Login</a>
    </div>

  </div>
</div>
