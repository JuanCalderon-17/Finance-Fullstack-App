<div class="auth-container">
  <div class="auth-card">
    
    <h2>{{ 'AUTH.FORGOT_PASSWORD.TITLE' | translate }}</h2>
    <p class="instruction">
      {{ 'AUTH.FORGOT_PASSWORD.INSTRUCTIONS' | translate }}
    </p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ 'AUTH.FORGOT_PASSWORD.EMAIL' | translate }}</label>
        
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          [placeholder]="'AUTH.FORGOT_PASSWORD.EMAIL_PLACEHOLDER' | translate"
          required
          [disabled]="isLoading">
      </div>

      <div *ngIf="message" style="color: green; margin-bottom: 1rem; font-weight: bold; text-align: center;">
        {{ message }}
      </div>

      <div *ngIf="errorMessage" style="color: red; margin-bottom: 1rem; font-weight: bold; text-align: center;">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="btn-submit" 
        [disabled]="isLoading || !email">
        {{ isLoading ? ('BUTTONS.SENDING' | translate) : ('AUTH.FORGOT_PASSWORD.BUTTON_SEND' | translate) }}
      </button>
    </form>

    <div class="back-link">
      <a routerLink="/auth/login">{{'AUTH.FORGOT_PASSWORD.BACK_TO_LOGIN' | translate }}</a>
    </div>

  </div>
</div>
