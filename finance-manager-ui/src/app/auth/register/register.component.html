<section class="register-container">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-xl-10">
        
        <div class="card rounded-3 text-white auth-card">
          <div class="row g-0">
            
            <div class="col-lg-6">
              <div class="card-body p-md-5 mx-md-4">

                <div class="text-center">
                  <img src="finanzaslogo.png" style="width: 160px; filter: brightness(0) invert(1);" alt="logo">
                  <h4 class="mt-1 mb-4 pb-1 title-text">{{'AUTH.REGISTER.TITLE' | translate }}</h4>
                </div>

                <form (ngSubmit)="register()">
                  
                  <div class="form-group mb-3">
                    <label class="form-label" for="fullName">{{ 'AUTH.REGISTER.FULL_NAME' | translate }}</label>
                    <input type="text" id="fullName" name="fullName" class="form-control custom-input"
                          [placeholder]="'AUTH.REGISTER.NAME_PLACEHOLDER' | translate" [(ngModel)]="model.fullName" required />
                  </div>

                  <div class="form-group mb-3"> 
                    <label class="form-label" for="email">{{'AUTH.REGISTER.EMAIL' | translate}}</label>
                    <input type="email" id="email" name="email" class="form-control custom-input"
                            [placeholder]="'AUTH.LOGIN.EMAIL_PLACEHOLDER' | translate" [(ngModel)]="model.email" required />
                  </div>

                  <div class="form-group mb-3">
                    <label class="form-label" for="password">{{ 'AUTH.REGISTER.PASSWORD' | translate }}</label>
                    <input type="password" id="password" name="password" class="form-control custom-input"
                          [placeholder]="'AUTH.LOGIN.PASSWORD_PLACEHOLDER' | translate" [(ngModel)]="model.password" required />
                  </div>

                  <div class="form-group mb-4">
                    <label class="form-label" for="confirmPassword">{{ 'AUTH.REGISTER.CONFIRM_PASSWORD' | translate }}</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control custom-input"
                          [placeholder]="'AUTH.LOGIN.PASSWORD_PLACEHOLDER' | translate"[(ngModel)]="model.confirmPassword" required />
                  </div>

                  <div class="text-center pt-1 mb-4 pb-1">
                    <button class="btn btn-primary btn-block fa-lg gradient-custom-2 mb-3 btn-register" 
                            type="submit" [disabled]="isLoading">
                      <span *ngIf="!isLoading">{{ 'AUTH.REGISTER.BUTTON' | translate }}</span>
                      <span *ngIf="isLoading">Creating account...</span>
                    </button>
                  </div>

                  <div class="d-flex align-items-center justify-content-center pb-4">
                    <p class="mb-0 me-2 text-muted">{{'AUTH.REGISTER.ALREADY_HAVE_ACCOUNT' | translate }}</p>
                    <button type="button" class="btn btn-outline-light btn-sm" routerLink="/auth/login">{{'AUTH.REGISTER.LOGIN_LINK' | translate }}</button>
                  </div>

                </form>

              </div>
            </div>

            <div class="col-lg-6 d-flex align-items-center gradient-side">
              <div class="text-white px-3 py-4 p-md-5 mx-md-4">
                <h4 class="mb-4 title-text">
                  {{'AUTH.REGISTER.HERO_TITLE' | translate }}
                </h4>
                <p class="small mb-0 text-muted-light">
                  {{'AUTH.REGISTER.HERO_TEXT' | translate }}
                </p>
              </div>
            </div>
          
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
