<div class="landing-container">
  
  <div class="logo-wrapper">
    <img src="finanzascapa.png" alt="Logo Finanzas" class="app-logo">
  </div>  

  <div class="language-switcher">
  
  <button class="current-lang-btn" (click)="toggleLangMenu()">
    @if (languageService.getCurrentLanguage() === 'es') {
      <img src="https://flagcdn.com/w40/es.png" alt="ES">
      <span>ES</span>
    }
    @if (languageService.getCurrentLanguage() === 'en') {
      <img src="https://flagcdn.com/w40/us.png" alt="US">
      <span>EN</span>
    }
    @if (languageService.getCurrentLanguage() === 'pt') {
      <img src="https://flagcdn.com/w40/br.png" alt="BR">
      <span>PT</span>
    }
    <span class="arrow" [class.rotate]="isLangMenuOpen">▼</span>
  </button>

  @if (isLangMenuOpen) {
    <div class="lang-dropdown">
      <button (click)="selectLanguage('es')">
        <img src="https://flagcdn.com/w40/es.png" alt="ES"> Español
      </button>
      <button (click)="selectLanguage('en')">
        <img src="https://flagcdn.com/w40/us.png" alt="US"> English
      </button>
      <button (click)="selectLanguage('pt')">
        <img src="https://flagcdn.com/w40/br.png" alt="BR"> Português
      </button>
    </div>
  }

  </div>
  
  <div class="hero-content">
    
    <div class="text-content">
      <h1 class="main-title">
        {{ 'LANDING.TITLE' | translate }} <br>
        {{ 'LANDING.SUBTITLE' | translate }}
      </h1>
      
      <p class="description">
        {{ 'LANDING.DESCRIPTION' | translate }}
      </p>

      <button routerLink="/auth/login" class="cta-button">
        {{ 'LANDING.CTA_BUTTON' | translate }}
      </button>
    </div>
    <div class="cards-showcase">
      
      <div class="card card-balance">
        <div class="card-label">Saldo disponible</div>
        <div class="card-amount">$1,248.50</div>
        <div class="card-actions">
          <button class="mini-btn">Ingresos</button>
          <button class="mini-btn">Gastos</button>
        </div>
      </div>

      <div class="card card-summary">
        <div class="card-date">24 de enero, 2026</div>
        <div class="card-highlight">+$350.00</div>
        <div class="card-subtitle">Ingreso anticipado</div>
      </div>

      <div class="card card-action">
        <div class="card-icon">💰</div>
        <div class="card-title">Agregar transacción</div>
      </div>

    </div>

  </div>

</div>
